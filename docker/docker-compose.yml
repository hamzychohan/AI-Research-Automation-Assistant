version: '3.8'

services:
  postgres-db:
    image: postgres:15-alpine
    container_name: assistant_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_assistant
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis-cache:
    image: redis:7-alpine
    container_name: assistant_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ../
      dockerfile: docker/backend.dockerfile
    container_name: assistant_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=ai_assistant
      - POSTGRES_HOST=postgres-db
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis-cache
      - REDIS_PORT=6379
      - DATABASE_URL=postgresql://postgres:postgres@postgres-db:5432/ai_assistant
      - SECRET_KEY=395d820b22a0a2df33ef064b52ff59c63f8d689b9d33b5c6893ddf96ec2b9f34
      - ALGORITHM=HS256
      - OPENAI_API_KEY=${OPENAI_API_KEY:-mock-openai-key-for-setup}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-mock-tavily-key-for-setup}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_API_BASE=${GROQ_API_BASE:-https://api.groq.com/openai/v1}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.1-8b-instant}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN:-}
      - SLACK_CHANNEL=${SLACK_CHANNEL:-#general}
      - GMAIL_CLIENT_ID=${GMAIL_CLIENT_ID:-}
      - GMAIL_CLIENT_SECRET=${GMAIL_CLIENT_SECRET:-}
      - GMAIL_REFRESH_TOKEN=${GMAIL_REFRESH_TOKEN:-}
    depends_on:
      - postgres-db
      - redis-cache

  frontend:
    build:
      context: ../
      dockerfile: docker/frontend.dockerfile
    container_name: assistant_frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
